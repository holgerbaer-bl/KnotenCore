[package]
name = "knoten_core"
version = "2.24.4"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "knoten"
path = "src/main.rs"

[features]
default = []
ui = [
    "dep:wgpu",
    "dep:winit",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:rodio",
    "dep:cpal",
    "dep:image",
    "dep:noise",
    "dep:glam",
    "dep:bytemuck",
    "aether_compiler/ui",
]

[dependencies]
dunce = "1.0"
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
cpal = { version = "0.15.3", optional = true }
pollster = "0.4.0"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
wgpu = { version = "23.0", optional = true }
winit = { version = "0.30", optional = true }
image = { version = "0.25.1", optional = true }
serde_json = "1.0.149"
egui = { version = "0.30", optional = true }
egui-wgpu = { version = "0.30", optional = true }
egui-winit = { version = "0.30", optional = true }
rodio = { version = "0.19.0", features = ["vorbis", "flac", "wav", "mp3"], optional = true }
noise = { version = "0.9.0", optional = true }
glam = { version = "0.32.0", features = ["bytemuck"], optional = true }
ureq = "2.9.1"
tower-lsp = { version = "0.20.0", features = ["runtime-tokio"] }
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dashmap = "6.1.0"
regex = "1.10"
chrono = "0.4"
crossbeam-channel = "0.5"
knoten_core_types = { path = "knoten_core_types" }
aether_compiler = { path = "aether_compiler", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "23.0", features = ["webgpu", "webgl"], optional = true }
winit = { version = "0.30", features = ["rwh_05", "rwh_06"], optional = true }

[workspace]
members = ["knoten_core_types", "aether_compiler"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

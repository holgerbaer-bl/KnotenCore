[package]
name = "aether_compiler"
version = "2.24.13"
edition = "2024"
autobins = false

[features]
default = []
ui = [
    "dep:wgpu",
    "dep:winit",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:rodio",
    "dep:cpal",
    "dep:image",
    "dep:noise",
    "dep:glam",
    "dep:bytemuck",
]

[dependencies]
dunce = "1.0"
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
cpal = { version = "0.15.3", optional = true }
memmap2 = "0.9"
pollster = "0.4.0"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
wgpu = { version = "23.0", optional = true }
winit = { version = "0.30", optional = true }
image = { version = "0.25.1", optional = true }
serde_json = "1.0.149"
egui = { version = "0.30", optional = true }
egui-wgpu = { version = "0.30", optional = true }
egui-winit = { version = "0.30", optional = true }
rodio = { version = "0.19.0", features = ["vorbis", "flac", "wav", "mp3"], optional = true }
noise = { version = "0.9.0", optional = true }
glam = { version = "0.32.0", features = ["bytemuck"], optional = true }
ureq = "2.9.1"
chrono = "0.4"
crossbeam-channel = "0.5"
dashmap = "6.1.0"
ring = "0.17"
knoten_core_types = { path = "../knoten_core_types" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1.5"

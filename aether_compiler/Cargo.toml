[package]
name = "aether_compiler"
version = "1.1.0"
edition = "2024"
autobins = false

[dependencies]
dunce = "1.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
cpal = "0.15.3"
pollster = "0.4.0"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
wgpu = "23.0"
winit = "0.30"
image = "0.25.1"
serde_json = "1.0.149"
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
rodio = { version = "0.19.0", features = ["vorbis", "flac", "wav", "mp3"] }
noise = "0.9.0"
glam = { version = "0.32.0", features = ["bytemuck"] }
ureq = "2.9.1"
chrono = "0.4"
crossbeam-channel = "0.5"
dashmap = "6.1.0"
knoten_core_types = { path = "../knoten_core_types" }

[dev-dependencies]
proptest = "1.5"
